<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Rüzgarlı Topçu Savaşları</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
        body { background: #1a1a1a; font-family: sans-serif; overflow: hidden; color: #fff; }
        #game-container { position: relative; width: 100vw; height: 100vh; background: #87CEEB; }
        canvas { display: block; width: 100%; height: 100%; }

        /* Dükkan / Mağaza Ekranı Overlay */
        #shop-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); display: flex; flex-direction: column;
            align-items: center; justify-content: center; z-index: 10;
        }
        #shop-screen h1 { font-size: 2rem; color: #f1c40f; margin-bottom: 20px; text-shadow: 2px 2px #000; }
        .shop-items { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; justify-content: center; }
        .shop-card {
            background: #2c3e50; padding: 15px; border-radius: 8px; border: 2px solid #34495e;
            text-align: center; width: 140px;
        }
        .shop-card h3 { font-size: 1rem; margin-bottom: 8px; color: #ecf0f1; }
        .btn-buy {
            background: #27ae60; border: none; color: white; padding: 8px 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold; margin-top: 8px; width: 100%;
        }
        .btn-buy:active { background: #2ecc71; }
        #btn-start-game {
            background: #e67e22; border: none; color: white; padding: 12px 30px;
            font-size: 1.2rem; font-weight: bold; border-radius: 6px; cursor: pointer;
        }

        /* Oyun İçi Mobil Kontroller */
        #touch-controls {
            position: absolute; bottom: 10px; left: 0; width: 100%;
            display: flex; justify-content: space-between; padding: 0 15px;
            pointer-events: none; z-index: 5;
        }
        .control-group { display: flex; gap: 10px; pointer-events: auto; }
        .t-btn {
            width: 55px; height: 55px; background: rgba(0,0,0,0.6); border: 2px solid #fff;
            border-radius: 50%; color: white; font-size: 1.2rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; touch-action: manipulation;
        }
        .t-btn:active, .t-btn.active { background: rgba(241, 196, 15, 0.8); color: #000; }
        #btn-fire { background: rgba(231, 76, 60, 0.8); width: 65px; height: 65px; border-radius: 50%; }

        /* Üst Skor ve Bilgi Paneli */
        #hud {
            position: absolute; top: 10px; left: 10px; right: 10px;
            display: flex; justify-content: space-between; font-weight: bold;
            font-size: 0.9rem; text-shadow: 1px 1px 2px #000; pointer-events: none; z-index: 5;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="hud">
        <div id="player-info">Can: <span id="hp-val">100</span> | Altın: <span id="gold-val">100</span></div>
        <div id="wind-info">Rüzgar: <span id="wind-val">0</span></div>
    </div>

    <!-- Dükkan Ekranı -->
    <div id="shop-screen">
        <h1>TOPÇU MAĞAZASI</h1>
        <div class="shop-items">
            <div class="shop-card">
                <h3>Güçlü Mermi</h3>
                <p>+15 Hasar</p>
                <button class="btn-buy" onclick="buyItem('damage')">50 Altın</button>
            </div>
            <div class="shop-card">
                <h3>Zırh Takviyesi</h3>
                <p>+25 Can</p>
                <button class="btn-buy" onclick="buyItem('health')">40 Altın</button>
            </div>
        </div>
        <button id="btn-start-game" onclick="startGame()">SAVAŞA BAŞLA</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <!-- Mobil Dokunmatik Kontroller -->
    <div id="touch-controls">
        <div class="control-group">
            <div class="t-btn" id="btn-left">◄</div>
            <div class="t-btn" id="btn-right">►</div>
        </div>
        <div class="control-group">
            <div class="t-btn" id="btn-angle-up">▲</div>
            <div class="t-btn" id="btn-angle-down">▼</div>
        </div>
        <div class="control-group">
            <div class="t-btn" id="btn-fire">ATEŞ</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// Oyun Durumları: 'SHOP', 'PLAYING'
let gameState = 'SHOP';
let playerGold = 100;
let wind = Math.floor(Math.random() * 11) - 5;

// Tek Tip Değişken İsimleri
const playerTank = {
    x: 80,
    y: 0,
    width: 40,
    height: 20,
    color: '#2ecc71',
    hp: 100,
    maxHp: 100,
    angle: 45,
    power: 50,
    damage: 25,
    speed: 3
};

const enemyTank = {
    x: 0,
    y: 0,
    width: 40,
    height: 20,
    color: '#e74c3c',
    hp: 100,
    alive: true,
    angle: 135
};

let projectiles = [];

function initGame() {
    playerTank.y = canvas.height - 70;
    enemyTank.x = canvas.width - 120;
    enemyTank.y = canvas.height - 70;
    document.getElementById('wind-val').innerText = wind > 0 ? `→ ${wind}` : `← ${Math.abs(wind)}`;
}

function buyItem(type) {
    if (type === 'damage' && playerGold >= 50) {
        playerGold -= 50;
        playerTank.damage += 15;
    } else if (type === 'health' && playerGold >= 40) {
        playerGold -= 40;
        playerTank.hp += 25;
        playerTank.maxHp += 25;
    }
    document.getElementById('gold-val').innerText = playerGold;
    document.getElementById('hp-val').innerText = playerTank.hp;
}

function startGame() {
    document.getElementById('shop-screen').style.display = 'none';
    gameState = 'PLAYING';
    initGame();
    gameLoop();
}

function fireCannon() {
    if (gameState !== 'PLAYING') return;
    
    const rad = (playerTank.angle * Math.PI) / 180;
    const speed = playerTank.power * 0.3;
    
    projectiles.push({
        x: playerTank.x + playerTank.width / 2,
        y: playerTank.y,
        vx: Math.cos(rad) * speed,
        vy: -Math.sin(rad) * speed,
        radius: 5
    });
}

function update() {
    if (gameState !== 'PLAYING') return;

    // Mermi Hareketleri
    for (let i = projectiles.length - 1; i >= 0; i--) {
        let p = projectiles[i];
        p.vx += wind * 0.005; // Rüzgar etkisi
        p.vy += 0.15; // Yerçekimi
        p.x += p.vx;
        p.y += p.vy;

        // Düşman Vurulma Kontrolü
        if (enemyTank.alive &&
            p.x >= enemyTank.x && p.x <= enemyTank.x + enemyTank.width &&
            p.y >= enemyTank.y && p.y <= enemyTank.y + enemyTank.height) {
            
            enemyTank.hp -= playerTank.damage;
            projectiles.splice(i, 1);
            if (enemyTank.hp <= 0) enemyTank.alive = false;
            continue;
        }

        // Zemin veya Ekran Dışı Kontrolü
        if (p.y >= canvas.height - 50 || p.x < 0 || p.x > canvas.width) {
            projectiles.splice(i, 1);
        }
    }
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Gökyüzü ve Zemin Çizimi
    ctx.fillStyle = '#87CEEB';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#2d572c';
    ctx.fillRect(0, canvas.height - 50, canvas.width, 50);

    // Bizim Tankımız (Sol)
    ctx.save();
    ctx.fillStyle = playerTank.color;
    ctx.fillRect(playerTank.x, playerTank.y, playerTank.width, playerTank.height);
    // Bizim Namlu
    ctx.translate(playerTank.x + playerTank.width / 2, playerTank.y);
    ctx.rotate((-playerTank.angle * Math.PI) / 180);
    ctx.fillStyle = '#1e8449';
    ctx.fillRect(0, -3, 25, 6);
    ctx.restore();

    // Rakip Düşman Tankı (Sağ)
    if (enemyTank.alive) {
        ctx.save();
        ctx.fillStyle = enemyTank.color;
        ctx.fillRect(enemyTank.x, enemyTank.y, enemyTank.width, enemyTank.height);
        // Rakip Namlu
        ctx.translate(enemyTank.x + enemyTank.width / 2, enemyTank.y);
        ctx.rotate((-enemyTank.angle * Math.PI) / 180);
        ctx.fillStyle = '#922b21';
        ctx.fillRect(0, -3, 25, 6);
        ctx.restore();
    }

    // Mermileri Çiz
    ctx.fillStyle = '#000';
    projectiles.forEach(p => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
        ctx.fill();
    });
}

function gameLoop() {
    update();
    draw();
    if (gameState === 'PLAYING') {
        requestAnimationFrame(gameLoop);
    }
}

// Dokunmatik Buton Kontrol Fonksiyonu
function setupTouchButton(buttonId, actionCallback) {
    const btn = document.getElementById(buttonId);
    if (!btn) return;

    let intervalId = null;

    const startAction = (e) => {
        if (e.cancelable) e.preventDefault();
        btn.classList.add('active');
        actionCallback();
        if (!intervalId) {
            intervalId = setInterval(actionCallback, 50);
        }
    };

    const stopAction = (e) => {
        if (e && e.cancelable) e.preventDefault();
        btn.classList.remove('active');
        if (intervalId) {
            clearInterval(intervalId);
            intervalId = null;
        }
    };

    btn.addEventListener('touchstart', startAction, { passive: false });
    btn.addEventListener('touchend', stopAction, { passive: false });
    btn.addEventListener('touchcancel', stopAction, { passive: false });
    btn.addEventListener('mousedown', startAction);
    btn.addEventListener('mouseup', stopAction);
    btn.addEventListener('mouseleave', stopAction);
}

// Dokunmatik Kontrolleri Bağla
setupTouchButton('btn-left', () => { playerTank.x = Math.max(10, playerTank.x - playerTank.speed); });
setupTouchButton('btn-right', () => { playerTank.x = Math.min(canvas.width / 2 - 50, playerTank.x + playerTank.speed); });
setupTouchButton('btn-angle-up', () => { playerTank.angle = Math.min(90, playerTank.angle + 1); });
setupTouchButton('btn-angle-down', () => { playerTank.angle = Math.max(0, playerTank.angle - 1); });

document.getElementById('btn-fire').addEventListener('click', fireCannon);
document.getElementById('btn-fire').addEventListener('touchstart', (e) => {
    e.preventDefault();
    fireCannon();
});
</script>
</body>
</html>
